<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d2b51">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MontiSmart - مونتي سمارت</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Babel (لترجمة كود React/JSX داخل المتصفح) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- الحاوية الأساسية التي سيعمل بداخلها تطبيق React -->
    <div id="root"></div>

    <!-- كود React -->
    <script type="text/babel" data-type="module">
        // 1. استدعاء React من روابط CDN
        import React, { useState, useEffect } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        
        // 2. استدعاء الأيقونات
        import { 
          Settings, Users, BookOpen, LogOut, Trash2, UserPlus, 
          Phone, ShieldCheck, BrainCircuit, HeartPulse, Activity, Baby, Edit3, Video 
        } from 'https://esm.sh/lucide-react@0.344.0';

        // 3. استدعاء Firebase (النسخة المتوافقة مع المتصفحات Modular V9)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, setDoc, deleteDoc, doc, getDoc, query, where, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyAHJITjCnWhdv629WCkYRgVPa6TxxH55-Y",
          authDomain: "montismart.firebaseapp.com",
          projectId: "montismart",
          storageBucket: "montismart.firebasestorage.app",
          messagingSenderId: "787008787995",
          appId: "1:787008787995:web:9dd7bf81c8a52a8a004abe",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // دالة مساعدة قوية لجلب صلاحية المستخدم بأمان
        const getUserRole = async (email) => {
          if (!email) return 'parent';
          if (email.toLowerCase() === 'admin@montismart.com') return 'admin';

          try {
            const q = query(collection(db, 'users'), where("email", "==", email), limit(1));
            const snapshot = await getDocs(q);
            if (!snapshot.empty) return snapshot.docs[0].data().role || 'parent';

            const docSnap = await getDoc(doc(db, 'users', email));
            if (docSnap.exists()) return docSnap.data().role || 'parent';
          } catch (error) { console.error(error); }
          return 'parent'; 
        };

        const AdminDashboard = ({ handleLogout, user }) => {
          const [activeTab, setActiveTab] = useState('settings');
          
          // States
          const [whatsapp, setWhatsapp] = useState('');
          const [cameraLink, setCameraLink] = useState('');
          const [msgSettings, setMsgSettings] = useState({ text: '', type: '' });
          
          const [usersList, setUsersList] = useState([]);
          const [userForm, setUserForm] = useState({ name: '', email: '', password: '', role: 'teacher' });
          const [msgUser, setMsgUser] = useState({ text: '', type: '' });

          const [classesList, setClassesList] = useState([]);
          const [classForm, setClassForm] = useState({ name: '', teacherId: '' });
          const [msgClass, setMsgClass] = useState({ text: '', type: '' });

          const [studentsList, setStudentsList] = useState([]);
          const [studentForm, setStudentForm] = useState({ name: '', dob: '', medicalInfo: '', classId: '', parentId: '' });
          const [msgStudent, setMsgStudent] = useState({ text: '', type: '' });

          useEffect(() => {
            fetchUsers(); fetchClasses(); fetchSettings(); fetchStudents();
          }, []);

          const fetchSettings = async () => {
            try {
              const docSnap = await getDoc(doc(db, 'settings', 'general'));
              if (docSnap.exists()) {
                if (docSnap.data().whatsapp) setWhatsapp(docSnap.data().whatsapp);
                if (docSnap.data().cameraLink) setCameraLink(docSnap.data().cameraLink);
              }
            } catch (error) { console.error(error); }
          };

          const fetchUsers = async () => {
            try {
              const snapshot = await getDocs(collection(db, 'users'));
              setUsersList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            } catch (error) { console.error(error); }
          };

          const fetchClasses = async () => {
            try {
              const snapshot = await getDocs(collection(db, 'classes'));
              setClassesList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            } catch (error) { console.error(error); }
          };

          const fetchStudents = async () => {
            try {
              const snapshot = await getDocs(collection(db, 'students'));
              setStudentsList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            } catch (error) { console.error(error); }
          };

          const handleUpdateSettings = async (e) => {
            e.preventDefault();
            setMsgSettings({text: 'جاري الحفظ...', type: 'info'});
            try {
              await setDoc(doc(db, 'settings', 'general'), { whatsapp: whatsapp, cameraLink: cameraLink }, { merge: true });
              setMsgSettings({text: 'تم تحديث الإعدادات بنجاح!', type: 'success'});
            } catch (error) { setMsgSettings({text: 'حدث خطأ أثناء الحفظ.', type: 'error'}); }
            setTimeout(() => setMsgSettings({text: '', type: ''}), 3000);
          };

          const handleCreateUser = async (e) => {
            e.preventDefault();
            setMsgUser({text: 'جاري الإنشاء...', type: 'info'});
            try {
              const secondaryApp = initializeApp(firebaseConfig, "Secondary");
              const secondaryAuth = getAuth(secondaryApp);
              await createUserWithEmailAndPassword(secondaryAuth, userForm.email, userForm.password);
              
              await setDoc(doc(db, 'users', userForm.email.toLowerCase()), {
                name: userForm.name,
                email: userForm.email.toLowerCase(),
                role: userForm.role,
                createdAt: new Date().toISOString()
              });

              setMsgUser({text: 'تم إنشاء المستخدم بنجاح!', type: 'success'});
              setUserForm({ name: '', email: '', password: '', role: 'teacher' });
              fetchUsers();
            } catch (error) { 
              let errorMsg = error.message;
              if (error.code === 'auth/email-already-in-use') errorMsg = 'عذراً.. هذا البريد الإلكتروني مسجل بالفعل لمستخدم آخر!';
              if (error.code === 'auth/weak-password') errorMsg = 'كلمة المرور ضعيفة جداً، يجب أن لا تقل عن 6 أحرف.';
              setMsgUser({text: errorMsg, type: 'error'}); 
            }
            setTimeout(() => setMsgUser({text: '', type: ''}), 5000);
          };

          const handleDeleteUser = async (id) => {
            try { await deleteDoc(doc(db, 'users', id)); fetchUsers(); } catch (err) { console.error(err); }
          };

          const handleCreateClass = async (e) => {
            e.preventDefault();
            setMsgClass({text: 'جاري الإنشاء...', type: 'info'});
            try {
              await addDoc(collection(db, 'classes'), {
                name: classForm.name,
                teacherId: classForm.teacherId,
                createdAt: new Date().toISOString()
              });
              setMsgClass({text: 'تم إنشاء الفصل بنجاح!', type: 'success'});
              setClassForm({ name: '', teacherId: '' });
              fetchClasses();
            } catch (error) { setMsgClass({text: 'حدث خطأ.', type: 'error'}); }
            setTimeout(() => setMsgClass({text: '', type: ''}), 3000);
          };

          const handleDeleteClass = async (id) => {
            try { await deleteDoc(doc(db, 'classes', id)); fetchClasses(); } catch (err) { console.error(err); }
          };

          const handleCreateStudent = async (e) => {
            e.preventDefault();
            setMsgStudent({text: 'جاري الإضافة...', type: 'info'});
            try {
              await addDoc(collection(db, 'students'), {
                name: studentForm.name,
                dob: studentForm.dob,
                medicalInfo: studentForm.medicalInfo,
                classId: studentForm.classId,
                parentId: studentForm.parentId,
                createdAt: new Date().toISOString()
              });
              setMsgStudent({text: 'تم إضافة الطفل بنجاح!', type: 'success'});
              setStudentForm({ name: '', dob: '', medicalInfo: '', classId: '', parentId: '' });
              fetchStudents();
            } catch (error) { setMsgStudent({text: 'حدث خطأ.', type: 'error'}); }
            setTimeout(() => setMsgStudent({text: '', type: ''}), 3000);
          };

          const handleDeleteStudent = async (id) => {
            try { await deleteDoc(doc(db, 'students', id)); fetchStudents(); } catch (err) { console.error(err); }
          };

          const teachersList = usersList.filter(u => u.role === 'teacher');
          const parentsList = usersList.filter(u => u.role === 'parent');

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row" dir="rtl">
              
              {/* Sidebar Navigation */}
              <div className="w-full md:w-72 bg-white border-b md:border-l border-gray-200 flex flex-col z-10 sticky top-0 md:h-screen">
                <div className="p-6 border-b border-gray-100 hidden md:block">
                  <h2 className="text-2xl font-black text-gray-800 tracking-tight">مونتي <span className="text-blue-600">سمارت</span></h2>
                  <p className="text-sm text-gray-500 mt-1">لوحة الإدارة</p>
                </div>
                
                <nav className="flex md:flex-col gap-2 p-4 overflow-x-auto md:overflow-visible">
                  <button onClick={() => setActiveTab('settings')} className={`flex items-center gap-3 px-4 py-3 rounded-xl font-semibold whitespace-nowrap transition-colors ${activeTab === 'settings' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <Settings className="w-5 h-5" /> الإعدادات
                  </button>
                  <button onClick={() => setActiveTab('users')} className={`flex items-center gap-3 px-4 py-3 rounded-xl font-semibold whitespace-nowrap transition-colors ${activeTab === 'users' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <Users className="w-5 h-5" /> المستخدمين
                  </button>
                  <button onClick={() => setActiveTab('classes')} className={`flex items-center gap-3 px-4 py-3 rounded-xl font-semibold whitespace-nowrap transition-colors ${activeTab === 'classes' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <BookOpen className="w-5 h-5" /> الفصول
                  </button>
                  <button onClick={() => setActiveTab('students')} className={`flex items-center gap-3 px-4 py-3 rounded-xl font-semibold whitespace-nowrap transition-colors ${activeTab === 'students' ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                    <Baby className="w-5 h-5" /> الأطفال
                  </button>
                  
                  <div className="md:mt-auto">
                    <button onClick={handleLogout} className="flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-red-600 hover:bg-red-50 w-full transition-colors whitespace-nowrap">
                      <LogOut className="w-5 h-5" /> خروج
                    </button>
                  </div>
                </nav>
              </div>

              {/* Main Content Area */}
              <div className="flex-1 p-6 md:p-10 overflow-y-auto">
                
                {activeTab === 'settings' && (
                  <div className="max-w-2xl space-y-8 animate-in fade-in">
                    <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2 border-b pb-4"><Settings className="text-blue-600" /> إعدادات الموقع العامة</h3>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                      <h4 className="text-lg font-bold text-gray-700 mb-6 flex items-center gap-2">
                        <Settings className="w-5 h-5 text-gray-500"/> روابط الاتصال والتطبيقات
                      </h4>
                      {msgSettings.text && <div className={`p-4 rounded-xl text-sm font-bold mb-6 ${msgSettings.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{msgSettings.text}</div>}
                      <form onSubmit={handleUpdateSettings} className="space-y-4">
                        <div className="p-4 bg-gray-50 rounded-xl border border-gray-100">
                          <label className="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"><Phone className="w-4 h-4 text-green-500"/> رقم التواصل (WhatsApp):</label>
                          <input type="text" placeholder="مثال: 201012345678" value={whatsapp} onChange={(e) => setWhatsapp(e.target.value)} className="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono" dir="ltr" />
                        </div>
                        <div className="p-4 bg-gray-50 rounded-xl border border-gray-100">
                          <label className="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"><Video className="w-4 h-4 text-blue-500"/> رابط تطبيق الكاميرات (البث المباشر):</label>
                          <input type="url" placeholder="https://..." value={cameraLink} onChange={(e) => setCameraLink(e.target.value)} className="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono" dir="ltr" />
                          <p className="text-xs text-gray-500 mt-2">هذا الرابط سيظهر لأولياء الأمور في لوحة التحكم لفتح تطبيق الكاميرا.</p>
                        </div>
                        <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all shadow-sm mt-4">
                          حفظ التعديلات
                        </button>
                      </form>
                    </div>
                  </div>
                )}

                {activeTab === 'users' && (
                  <div className="space-y-8 animate-in fade-in">
                    <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2 border-b pb-4"><Users className="text-blue-600" /> إدارة النظام والمستخدمين</h3>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h4 className="text-lg font-bold text-gray-700 mb-4">إنشاء حساب جديد</h4>
                        {msgUser.text && <div className={`p-3 rounded-xl text-sm font-bold mb-4 ${msgUser.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{msgUser.text}</div>}
                        <form onSubmit={handleCreateUser} className="space-y-4">
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">الاسم الكامل</label>
                            <input required type="text" value={userForm.name} onChange={e=>setUserForm({...userForm, name:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
                            <input required type="email" value={userForm.email} onChange={e=>setUserForm({...userForm, email:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" dir="ltr" />
                          </div>
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">كلمة المرور</label>
                            <input required type="password" value={userForm.password} onChange={e=>setUserForm({...userForm, password:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" dir="ltr" minLength="6" />
                          </div>
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">نوع الحساب</label>
                            <select value={userForm.role} onChange={e=>setUserForm({...userForm, role:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 font-semibold cursor-pointer">
                              <option value="teacher">مدرس / معلم</option>
                              <option value="parent">ولي أمر</option>
                              <option value="admin">إدارة (أدمن)</option>
                            </select>
                          </div>
                          <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all mt-2">إنشاء الحساب</button>
                        </form>
                      </div>

                      <div className="xl:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                          <h4 className="font-bold text-gray-700">المستخدمين ({usersList.length})</h4>
                          <button onClick={fetchUsers} className="text-sm text-blue-600 font-bold hover:underline">تحديث القائمة</button>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-right text-sm">
                            <thead className="bg-gray-100 text-gray-600">
                              <tr><th className="p-4">الاسم</th><th className="p-4">البريد</th><th className="p-4">الصلاحية</th><th className="p-4 text-center">إجراء</th></tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                              {usersList.map(u => (
                                <tr key={u.id} className="hover:bg-gray-50">
                                  <td className="p-4 font-bold text-gray-800 whitespace-nowrap">{u.name || '-'}</td>
                                  <td className="p-4 text-gray-500 whitespace-nowrap" dir="ltr">{u.email}</td>
                                  <td className="p-4 whitespace-nowrap">
                                    <span className={`px-2 py-1 rounded-md text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'teacher' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                                      {u.role === 'admin' ? 'أدمن' : u.role === 'teacher' ? 'مدرس' : 'ولي أمر'}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <button onClick={()=>handleDeleteUser(u.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors"><Trash2 className="w-4 h-4"/></button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'classes' && (
                  <div className="space-y-8 animate-in fade-in">
                    <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2 border-b pb-4"><BookOpen className="text-blue-600" /> إدارة الفصول</h3>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h4 className="text-lg font-bold text-gray-700 mb-4">إنشاء فصل جديد</h4>
                        {msgClass.text && <div className={`p-3 rounded-xl text-sm font-bold mb-4 ${msgClass.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{msgClass.text}</div>}
                        <form onSubmit={handleCreateClass} className="space-y-4">
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">اسم الفصل</label>
                            <input required type="text" value={classForm.name} onChange={e=>setClassForm({...classForm, name:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" />
                          </div>
                          <div>
                            <label className="block text-sm font-bold text-gray-700 mb-1">المعلم المسؤول</label>
                            <select required value={classForm.teacherId} onChange={e=>setClassForm({...classForm, teacherId:e.target.value})} className="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 font-semibold cursor-pointer">
                              <option value="">-- اختر المعلم --</option>
                              {teachersList.map(t => <option key={t.id} value={t.email}>{t.name} ({t.email})</option>)}
                            </select>
                          </div>
                          <button type="submit" disabled={!classForm.teacherId} className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition-all mt-2 disabled:opacity-50">إنشاء الفصل</button>
                        </form>
                      </div>

                      <div className="xl:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 bg-gray-50 border-b flex justify-between items-center">
                          <h4 className="font-bold text-gray-700">الفصول الحالية ({classesList.length})</h4>
                          <button onClick={fetchClasses} className="text-sm text-blue-600 font-bold hover:underline">تحديث القائمة</button>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-right text-sm">
                            <thead className="bg-gray-100 text-gray-600">
                              <tr><th className="p-4">اسم الفصل</th><th className="p-4">المعلم المسؤول</th><th className="p-4 text-center">إجراء</th></tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                              {classesList.map(c => {
                                const teacher = usersList.find(u => u.email === c.teacherId || u.id === c.teacherId);
                                return (
                                  <tr key={c.id} className="hover:bg-gray-50">
                                    <td className="p-4 font-bold text-gray-800 whitespace-nowrap">{c.name}</td>
                                    <td className="p-4 text-blue-600 font-bold whitespace-nowrap">{teacher ? teacher.name : (c.teacherId || 'غير معروف')}</td>
                                    <td className="p-4 text-center">
                                      <button onClick={()=>handleDeleteClass(c.id)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors"><Trash2 className="w-4 h-4"/></button>
                                    </td>
                                  </tr>
                                )
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'students' && (
                  <div className="space-y-8 animate-in fade-in">
                    <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2 border-b pb-4"><Baby className="text-blue-600" /> تسجيل ملفات الأطفال</h3>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h4 className="text-lg font-bold text-gray-700 mb-4">إضافة طفل جديد</h4>
                        {msgStudent.text && <div className={`p-3 rounded-xl text-sm font-bold mb-4 ${msgStudent.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>{msgStudent.text}</div>}
                        <form onSubmit={handleCreateStudent} className="space-y-4">
                          <div>

          useEffect(() => {
            fetchMyChildren();
            fetchCameraLink();
          }, []);

          const fetchCameraLink = async () => {
            try {
              const docSnap = await getDoc(doc(db, 'settings', 'general'));
              if (docSnap.exists() && docSnap.data().cameraLink) {
                setCameraLink(docSnap.data().cameraLink);
              }
            } catch (error) { console.error("Error fetching camera link:", error); }
          };

          const fetchMyChildren = async () => {
            setLoading(true);
            try {
              const q = query(collection(db, 'students'), where("parentId", "==", user.email.toLowerCase()));
              const snapshot = await getDocs(q);
              const children = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setMyChildren(children);
            } catch (error) { console.error("Error fetching children:", error); }
            setLoading(false);
          };

          const openChildProfile = async (child) => {
            setSelectedChild(child);
            setMedicalText(child.medicalInfo || '');
            setEditMedical(false);
            setLoadingReports(true);
            try {
              const q = query(collection(db, 'reports'), where("studentId", "==", child.id));
              const snapshot = await getDocs(q);
              const reports = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              reports.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
              setChildReports(reports);
            } catch (error) { console.error("Error fetching reports:", error); }
            setLoadingReports(false);
          };

          const handleSaveMedical = async () => {
            setSavingMed(true);
            try {
              await setDoc(doc(db, 'students', selectedChild.id), { medicalInfo: medicalText }, { merge: true });
              const updatedChild = { ...selectedChild, medicalInfo: medicalText };
              setSelectedChild(updatedChild);
              setMyChildren(myChildren.map(c => c.id === updatedChild.id ? updatedChild : c));
              setEditMedical(false);

        function App() {
          const [route, setRoute] = useState('landing');
          const [user, setUser] = useState(null);

          useEffect(() => {
            const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
              if (currentUser) {
                const role = await getUserRole(currentUser.email);
                setUser({ email: currentUser.email, role: role });
                setRoute('dashboard');
              } else {
                setUser(null);
              }
            });
            return () => unsubscribe();
          }, []);

          const handleLogout = async () => {
            await signOut(auth);
            setUser(null);
            setRoute('landing');
          };

          if (route === 'landing') return <LandingPage setRoute={setRoute} />;
          if (route === 'login') return <Login setRoute={setRoute} setUser={setUser} />;
          
          if (route === 'dashboard' && user) {
            if (user.role === 'admin') return <AdminDashboard handleLogout={handleLogout} user={user} />;
            if (user.role === 'teacher') return <TeacherDashboard handleLogout={handleLogout} user={user} />;
            if (user.role === 'parent') return <ParentDashboard handleLogout={handleLogout} user={user} />;
          }

          return <div className="min-h-screen flex items-center justify-center bg-gray-50 text-blue-600 font-bold">جاري التحميل...</div>;
        }

        // تشغيل تطبيق React داخل وسم الـ root
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
